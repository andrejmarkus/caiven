[package]
name = "caiven-studio"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "caiven-studio"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# WebDriver automation plugin, for driving the UI from tests and the
# `tauri-automation` MCP server. Deliberately off by default: it opens a
# remote-control channel into a running Studio, which has no business being
# in a build a creator installs. Enable it explicitly for local automation
# (`cargo build -p caiven-studio --features automation`).
automation = ["dep:tauri-plugin-webdriver-automation"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
caiven-core = { workspace = true }
caiven-cart = { workspace = true }
caiven-vm = { workspace = true }
image = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-runtime = { workspace = true }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-webdriver-automation = { version = "0.1", optional = true }
toml = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }
