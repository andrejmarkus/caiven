[package]
name = "caiven-machine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "caiven-machine"
path = "src/main.rs"

[features]
# Desktop and CI: build SDL from source and link it in, so the artifact is
# self-contained and no runner needs a libsdl2-dev step. Forwarded to
# caiven-vm too — its `sdl2` dependency is a separate optional-dependency
# activation from this crate's own, since caiven-vm's SDL audio backend
# (`vm::audio::sdl_audio_factory`/`sdl_default_audio_factory`) needs the
# same bundled-vs-dynamic choice this crate makes for video.
default = ["sdl2-bundled"]
sdl2-bundled = ["sdl2/bundled", "sdl2/static-link", "caiven-vm/sdl2-bundled"]
# Handhelds (Miyoo, TrimUI, Anbernic): link against the device's own patched
# libSDL2.so. Those ports carry device-specific display and input code that a
# bundled upstream SDL would not have. Build with
# `--no-default-features --features sdl2-dynamic`.
sdl2-dynamic = ["caiven-vm/sdl2-dynamic"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
caiven-core = { workspace = true }
caiven-cart = { workspace = true }
caiven-vm = { path = "../caiven-vm", default-features = false }
fontdue = { workspace = true }
log = { workspace = true }
sdl2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
svgtypes = { workspace = true }
tiny-skia = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
