[workspace]
members = ["crates/caiven-core", "crates/caiven-cart", "crates/caiven-machine", "crates/caiven-vm", "crates/caiven-studio", "crates/caiven-port", "crates/caiven-web", "crates/migration"]
resolver = "2"

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.17.1"
crc32fast = "1"
dotenvy = "0.15"
eframe = "0.32"
egui = "0.32"
egui_extras = "0.32"
env_logger = "0.11"
caiven-core = { path = "crates/caiven-core" }
caiven-cart = { path = "crates/caiven-cart" }
caiven-vm = { path = "crates/caiven-vm" }
image = "0.25"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
log = "0.4"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
mlua-sys = { version = "0.6", features = ["lua54", "vendored"] }
pixels = "0.15"
png = "0.18"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
rocket = { version = "0.5", features = ["json"] }
totp-rs = { version = "5", features = ["qr", "gen_secret"] }
sea-orm = { version = "1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
migration = { path = "crates/migration" }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tauri = "=2.10.3"
tauri-runtime = "=2.10.1"
ureq = "2"
uuid = { version = "1", features = ["v4"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
wry = "=0.54.0"
winit = "0.30"
