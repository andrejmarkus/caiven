name: CI and Release

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            crates/caiven-port/web/package-lock.json
            crates/caiven-studio-ui/package-lock.json
      - name: Install Studio dependencies
        run: npm --prefix crates/caiven-studio-ui ci
      - name: Install Port dependencies
        run: npm --prefix crates/caiven-port/web ci
      - name: Check shared UI boundaries
        run: npm --prefix crates/caiven-studio-ui run check:ui
      - name: Check Studio frontend
        run: npm --prefix crates/caiven-studio-ui run check
      - name: Check Port frontend
        run: npm --prefix crates/caiven-port/web run check
      - name: Test Studio frontend
        run: npm --prefix crates/caiven-studio-ui test
      - name: Install Playwright Chromium
        run: npm --prefix crates/caiven-studio-ui exec playwright install --with-deps chromium
      - name: Test Studio end-to-end (3x)
        run: npm --prefix crates/caiven-studio-ui run test:e2e:stress
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-playwright-diagnostics
          path: |
            crates/caiven-studio-ui/playwright-report
            crates/caiven-studio-ui/test-results
          if-no-files-found: ignore
      - name: Build Studio frontend
        run: npm --prefix crates/caiven-studio-ui run build
      - name: Build Port frontend
        run: npm --prefix crates/caiven-port/web run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libxkbcommon-dev \
            pkg-config
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
      - name: Test
        run: cargo test --locked --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/caiven-studio-ui/package-lock.json
      - name: Build frontend
        run: |
          npm --prefix crates/caiven-studio-ui ci
          npm --prefix crates/caiven-studio-ui run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libxkbcommon-dev \
            pkg-config
      - name: Check formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt.log
      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formatting-diagnostics
          path: fmt.log
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets -- -D warnings -A unused-imports 2>&1 | tee clippy.log
      - name: Upload clippy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics
          path: clippy.log

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        # sqlx-mysql keeps rsa in Cargo.lock through sqlx macro metadata, but this
        # workspace enables only SQLite and PostgreSQL. No patched rsa release exists.
        run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (Port web)
        run: |
          npm --prefix crates/caiven-port/web ci
          npm --prefix crates/caiven-port/web audit --omit=dev --audit-level=high
      - name: npm audit (Studio UI)
        run: |
          npm --prefix crates/caiven-studio-ui ci
          npm --prefix crates/caiven-studio-ui audit --omit=dev --audit-level=high

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/caiven-studio-ui/package-lock.json
      - name: Build frontend
        run: |
          npm --prefix crates/caiven-studio-ui ci
          npm --prefix crates/caiven-studio-ui run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libxkbcommon-dev \
            pkg-config
      - name: Build docs
        run: cargo doc --locked --no-deps

  release-check:
    name: Validate Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Studio version
        shell: bash
        run: |
          APP_VERSION="$(node --print "require('./crates/caiven-studio/tauri.conf.json').version")"
          if [[ -z "$APP_VERSION" ]]; then
            echo "::error::Studio version must be set in tauri.conf.json"
            exit 1
          fi
      - name: Verify tag matches Studio version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION="$(node --print "require('./crates/caiven-studio/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match Studio version v$APP_VERSION"
            exit 1
          fi

  machine-artifacts:
    name: Caiven Machine (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: release-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            executable: caiven-machine
            archive: caiven-machine-linux-x86_64.tar.gz
          - label: Windows x64
            os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            executable: caiven-machine.exe
            archive: caiven-machine-windows-x86_64.zip
          - label: macOS Apple Silicon
            os: macos-latest
            platform: macos-aarch64
            target: aarch64-apple-darwin
            executable: caiven-machine
            archive: caiven-machine-macos-aarch64.tar.gz
          - label: macOS Intel
            os: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
            executable: caiven-machine
            archive: caiven-machine-macos-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: machine-${{ matrix.target }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev pkg-config
      - name: Build Caiven Machine
        run: cargo build --locked --release -p caiven-machine --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" dist/
          cp README.md LICENSE CREATOR_RIGHTS.md dist/
          tar -czf "${{ matrix.archive }}" -C dist .
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" dist/
          Copy-Item README.md, LICENSE, CREATOR_RIGHTS.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"
      - name: Upload Caiven Machine
        uses: actions/upload-artifact@v4
        with:
          name: caiven-machine-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  studio-bundles:
    name: Caiven Studio (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: release-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/caiven-studio-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix crates/caiven-studio-ui ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: studio-${{ matrix.target }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libxkbcommon-dev \
            patchelf \
            pkg-config
      - name: Build native installers
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: crates/caiven-studio
          tauriScript: npm --prefix ../caiven-studio-ui exec tauri
          args: ${{ matrix.args }}
          retryAttempts: 1
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: caiven-studio-[platform]-[arch]-[bundle]

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, lint, security, doc, machine-artifacts, studio-bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: caiven-*
          path: release
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/**/*
